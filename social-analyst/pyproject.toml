[project]
name = "sma"
version = "0.1.0"
description = "Social media analyst toolkit: Buffer publishing, owned-account analytics, profile discovery, Gemini video breakdowns. Agent-agnostic CLI + MCP server."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "google-genai>=1.30",
    "yt-dlp>=2026.10.0",
    "mcp>=2.0",
    "google-auth-oauthlib>=1.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
instagram = ["instaloader>=4.14"]
x = ["twscrape>=0.17"]

[project.scripts]
sma = "sma.cli:main"
sma-mcp = "sma.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reference", ".venv", "data", "accounts"]
